<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Ethan Scott</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1f3a2b">
  <link rel="icon" type="image/png" href="/images/E-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <!-- Absolute paths on purpose: a 404 can be served from any URL depth,
       so relative paths like "style.css" would break. -->
  <link rel="stylesheet" href="/style.css">
  <style>
    .lost {
      min-height: calc(100vh - 140px);
      display: grid;
      place-items: center;
      padding: 32px var(--pad);
    }
    .lost .hero {
      margin: 0;
      text-align: center;
      max-width: 34rem;
    }
    .lost .lede { margin-left: auto; margin-right: auto; }
    .lost .hero-actions { justify-content: center; }
  </style>
</head>
<body>

  <header class="site-header">
    <a class="site-mark" href="/">Ethan Scott</a>
    <nav aria-label="Main">
      <a href="/#works">Works</a>
      <a href="/#gallery">Gallery</a>
      <a href="/#about">About</a>
    </nav>
  </header>

  <main class="lost">
    <section class="hero">
      <p class="eyebrow">Error 404</p>
      <h1>This page has wandered off</h1>
      <p class="lede">
        The link may be old or mistyped. Head back to the main page, or go straight to the story.
      </p>
      <p class="hero-actions">
        <a class="btn btn-solid" href="/">Back to the home page</a>
        <a class="btn btn-solid" href="https://www.royalroad.com/fiction/195172/journey-through-the-endless-castle-progression">Read on Royal Road</a>
      </p>
    </section>
  </main>

</body>
</html>
