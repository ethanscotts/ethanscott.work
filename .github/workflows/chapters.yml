name: Update latest chapters

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch chapters from Royal Road
        run: node scripts/fetch-chapters.mjs

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/chapters.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/chapters.json
            git commit -m "Update latest chapters"
            git push
          else
            echo "No new chapters."
          fi
